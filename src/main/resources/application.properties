spring.application.name=OperationHub
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.devtools.restart.enabled=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongChangeThisToSomethingSecure12345
jwt.expiration=86400000

# OAuth 2.0 Configuration
# Google OAuth Client ID - Replace with your actual Google Client ID
oauth2.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id-here}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret-here}

