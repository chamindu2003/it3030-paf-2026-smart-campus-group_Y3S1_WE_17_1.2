spring.application.name=OperationHub
server.port=8081
server.servlet.context-path=/
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/operationhub
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.h2.console.enabled=false
spring.devtools.restart.enabled=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongChangeThisToSomethingSecure12345
jwt.expiration=86400000

# OAuth 2.0 Configuration
# Google OAuth Client ID - Replace with your actual Google Client ID
oauth2.google.client-id=${GOOGLE_CLIENT_ID:584522305897-e4imhiui27j808mdctedqalbf3bc605e.apps.googleusercontent.com}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret-here}

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8081,https://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

